name: Tests

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a Home Assistant release that breaks the companion shows up
    # here before it shows up as "unreachable" in the app.
    - cron: "0 3 * * 1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
